stages:
  - terraform-deploy
  - terraform-destroy

# deploy
terraform:
  stage: terraform-deploy
  tags:
    - aws
    - ec2
  image: hashicorp/terraform:latest
  script:
    - terraform init
    - terraform validate
    - terraform plan
    - terraform apply -auto-approve
  artifacts:
    paths:
      - terraform.tfstate
      - terraform.tfstate.backup
      - .terraform

# destroy
terraform-destroy:
  stage: terraform-destroy
  tags:
    - aws
    - ec2
  when: manual
  script:
    - terraform init
    - terraform destroy -auto-approve
    - rm -r terraform*
    
